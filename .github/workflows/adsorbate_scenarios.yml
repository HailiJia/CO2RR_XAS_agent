name: Structure labels and grouped ML tests

on:
  pull_request:
    paths:
      - "agent/**"
      - "tools/**"
      - "tests/**"
      - "web_app/**"
      - "workflow/**"
      - "generators/**"
      - "requirements.txt"
      - ".github/workflows/adsorbate_scenarios.yml"
  workflow_dispatch:

jobs:
  adsorbate-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pydantic custodian pytest jsonschema scikit-learn joblib ase pymatgen

      - name: Run adsorbate scenario regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_adsorbate_scenarios.py tests/test_geometry_labels.py tests/test_grouped_xas_ml.py tests/test_label_workflow_integration.py tests/test_xas_ml_peak_descriptors.py tests/test_ml_xas_workflow.py
