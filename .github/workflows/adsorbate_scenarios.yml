name: Adsorbate scenario tests

on:
  pull_request:
    paths:
      - "agent/**"
      - "tools/**"
      - "tests/test_adsorbate_scenarios.py"
      - ".github/workflows/adsorbate_scenarios.yml"
  workflow_dispatch:

jobs:
  adsorbate-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pydantic custodian pytest

      - name: Run adsorbate scenario regression tests
        run: pytest -q tests/test_adsorbate_scenarios.py
